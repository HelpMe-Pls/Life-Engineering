<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Renewal Runbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,wght@1,400;1,500&display=swap">
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#141C26; --muted:#5C6878; --line:#D7DDE5;
  --he:#E9EDF2; --he-ink:#3A4654;
  --accent:#B0741A; --accent-ink:#7A4E0B; --accent-soft:#FBF3E2; --accent-line:#E5C98A;
  --route:#0E6F68; --route-soft:#E1F2F0;
  --win:#1E7A3C; --win-soft:#E3F3E8; --exit:#A83224; --exit-soft:#FBE8E5;
  --shadow:0 1px 2px rgba(20,28,38,.06); --pop:0 10px 28px rgba(20,28,38,.18);
  --barh:96px;
  --display:"IBM Plex Sans Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --script:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1419; --surface:#171D24; --ink:#E6ECF2; --muted:#96A3B2; --line:#2A333D;
    --he:#1F2730; --he-ink:#C3CCD6;
    --accent:#E2AA3E; --accent-ink:#F0C97A; --accent-soft:#251F12; --accent-line:#6B5220;
    --route:#3FD1C0; --route-soft:#12302E;
    --win:#5BD584; --win-soft:#14301F; --exit:#F08A7D; --exit-soft:#3A1B18;
    --shadow:none; --pop:0 10px 28px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1419; --surface:#171D24; --ink:#E6ECF2; --muted:#96A3B2; --line:#2A333D;
  --he:#1F2730; --he-ink:#C3CCD6;
  --accent:#E2AA3E; --accent-ink:#F0C97A; --accent-soft:#251F12; --accent-line:#6B5220;
  --route:#3FD1C0; --route-soft:#12302E;
  --win:#5BD584; --win-soft:#14301F; --exit:#F08A7D; --exit-soft:#3A1B18;
  --shadow:none; --pop:0 10px 28px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:calc(var(--barh) + 12px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 48px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding-inline:16px;padding-block:12px 8px;border-bottom:1px solid var(--line)}
.bar .wrap{max-width:1040px;margin:0 auto}
.bar .row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.01em;margin:0;line-height:1.1;text-wrap:balance}
.kicker{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.navbtn{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.02em;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.navbtn[aria-expanded="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;font-family:var(--display);font-weight:600;font-size:13.5px;letter-spacing:.02em;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .odds{opacity:.75;font-weight:600;margin-left:6px}
main{max-width:1040px;margin:0 auto;padding-top:14px;display:grid;grid-template-columns:minmax(0,1fr);gap:0 28px}
#content{min-width:0;max-width:760px}
.side{display:none}
.side.open{display:block;position:fixed;left:16px;right:16px;top:calc(var(--barh) + env(safe-area-inset-top,0px) + 6px);z-index:6;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 10px 12px;max-height:60vh;overflow:auto;box-shadow:var(--pop)}
.side .k2{padding:2px 8px 6px}
.navlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.navlist a{display:grid;grid-template-columns:20px 22px minmax(0,1fr);gap:6px;align-items:baseline;padding:6px 8px;border-radius:8px;color:var(--ink);text-decoration:none;font-family:var(--display);font-weight:600;font-size:13.5px;line-height:1.25}
.navlist a .ni{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.navlist a .nj{font-size:14px}
.navlist a:hover{background:var(--he)}
.navlist a.active{background:var(--accent-soft);color:var(--accent-ink);box-shadow:inset 3px 0 0 var(--accent)}
.navlist a.win{color:var(--win)} .navlist a.exit{color:var(--exit)}
.side .toggle{margin:10px 8px 0}
@media (min-width:900px){
  main{grid-template-columns:236px minmax(0,1fr)}
  .side{display:block;position:sticky;top:calc(var(--barh) + env(safe-area-inset-top,0px) + 12px);align-self:start;max-height:calc(100vh - var(--barh) - 32px);overflow:auto;padding-right:4px}
  .navbtn{display:none}
}
.intro{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.intro h2{font-family:var(--display);font-weight:700;font-size:19px;margin:0;line-height:1.15;text-wrap:balance}
.intro p{margin:0;color:var(--muted);max-width:62ch}
.toggle{font-family:var(--body);font-size:13px;font-weight:500;color:var(--route);background:none;border:1px solid var(--route);border-radius:999px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.tab:focus-visible,.head:focus-visible,.toggle:focus-visible,.go:focus-visible,.navbtn:focus-visible,.navlist a:focus-visible{outline:2px solid var(--route);outline-offset:2px}
.beats{display:flex;flex-direction:column;gap:0;position:relative;margin-top:6px}
.beat{display:grid;grid-template-columns:34px 1fr;gap:0 10px;position:relative;padding-block:10px}
.beat::before{content:"";position:absolute;left:16px;top:0;bottom:0;width:2px;background:var(--line)}
.beat:first-child::before{top:12px}
.beat:last-child::before{bottom:auto;height:26px}
.n{position:relative;z-index:1;width:34px;height:34px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:6px}
.beat.win .n{border-color:var(--win);color:var(--win)}
.beat.exit .n{border-color:var(--exit);color:var(--exit)}
.col{display:flex;flex-direction:column;gap:6px;min-width:0}
.he{background:var(--he);color:var(--he-ink);border-radius:10px;padding:8px 11px;font-size:14px;line-height:1.4}
.he .who{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:8px}
.you{background:var(--surface);border:1px solid var(--accent-line);border-left:4px solid var(--accent);border-radius:10px;padding:9px 11px 10px;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.you:hover{border-color:var(--accent)}
.you[data-open="true"]{background:var(--accent-soft)}
.head{display:grid;grid-template-columns:auto 1fr auto;gap:0 10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:0;margin:0;cursor:pointer;color:var(--ink);font-family:var(--body)}
.head .jump{font-size:18px;line-height:1.2}
.head .label{font-family:var(--display);font-weight:700;font-size:14.5px;letter-spacing:.01em;line-height:1.2}
.head .label small{display:block;font-family:var(--body);font-weight:500;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.cta{font-family:var(--display);font-weight:600;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);border:1px solid var(--accent-line);border-radius:999px;padding:4px 9px;white-space:nowrap}
.you[data-open="true"] .cta{background:var(--surface)}
.gist{margin:0;padding-left:28px;font-family:var(--script);font-style:italic;font-size:15.5px;color:var(--accent-ink);line-height:1.35}
.you[data-open="true"] .gist{display:none}
.body{border-top:1px dashed var(--accent-line);padding-top:8px;margin-top:2px;display:flex;flex-direction:column;gap:8px;cursor:auto}
.say{margin:0;font-family:var(--script);font-style:italic;font-size:16px;line-height:1.45;color:var(--ink);text-indent:-.5em;padding-left:.5em}
.pause{display:inline-block;font-family:var(--display);font-style:normal;font-weight:700;font-size:11px;letter-spacing:.08em;color:var(--route);background:var(--route-soft);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.why{margin:0;font-size:13.5px;color:var(--muted)}
.why b{color:var(--ink);font-weight:600}
.k2{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.forks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.forks li{font-size:13.5px;display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:baseline}
.forks .if{font-family:var(--display);font-weight:600;font-size:12.5px;color:var(--route);background:var(--route-soft);border-radius:6px;padding:1px 7px;white-space:nowrap}
.forks li.w .if{color:var(--win);background:var(--win-soft)}
.forks li.x .if{color:var(--exit);background:var(--exit-soft)}
.forks .say{font-size:15px;display:inline}
.gos{display:flex;flex-wrap:wrap;gap:6px}
.go{font-family:var(--display);font-weight:600;font-size:12.5px;color:var(--route);background:var(--route-soft);border:1px solid transparent;border-radius:8px;padding:4px 9px;cursor:pointer}
.go:hover{border-color:var(--route)}
.conv{border-collapse:collapse;font-size:13.5px;width:auto}
.conv td,.conv th{padding:3px 12px 3px 0;border-bottom:1px solid var(--line);text-align:left}
.conv th{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.conv td.num{font-variant-numeric:tabular-nums;font-weight:600}
.card{background:var(--surface);border:1px solid var(--accent-line);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.45}
.card .t{font-family:var(--display);font-weight:700;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);margin:0 0 4px}
.card p{margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.tile .k{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 3px}
.tile .v{margin:0;font-size:14px}
.tile.w{border-color:var(--win)} .tile.x{border-color:var(--exit)}
table.bolts{border-collapse:collapse;width:100%;font-size:14px}
.bolts th,.bolts td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.bolts th{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bolts td.bn{font-family:var(--display);font-weight:700;white-space:nowrap}
.bolts .say{font-size:14.5px;display:inline}
@media (max-width:600px){
  .bolts,.bolts tbody,.bolts tr,.bolts td{display:block}
  .bolts tr:first-child{display:none}
  .bolts tr{border-bottom:1px solid var(--line);padding-block:8px}
  .bolts td{border:0;padding:2px 0}
  .bolts td[data-l]::before{content:attr(data-l);font-weight:600;color:var(--muted)}
}
.section{margin-top:18px}
.section h3{font-family:var(--display);font-weight:700;font-size:16px;margin:0 0 8px}
.foot{margin-top:22px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-top:10px}
@media (max-width:420px){.gist{padding-left:0}}
</style>
</head>
<body>
<header class="bar" id="bar"><div class="wrap">
  <div class="row">
    <div><p class="kicker">Mon 3:00 PM · camera on · HUD in the narrow window</p><h1>Renewal Runbook</h1></div>
    <button class="navbtn" id="navbtn" aria-expanded="false" aria-controls="side">☰ Beats</button>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
</div></header>
<main>
  <nav class="side" id="side" aria-label="Beats"></nav>
  <div id="content"></div>
</main>

<script>
const TRACKS = [
{
  id:"likely", tab:"The likely room", odds:"60%",
  title:"His review. A package under forty. One move. The date fight. Then the clock.",
  intro:"One beat is one exchange. The grey card is his line. The amber card is your line. Tap an amber card to open the script, the why, and the branches. Your number does not move. The step does the work.",
  beats:[
    {he:"Hey man, good weekend? Mai's been on me to wrap this up, I read your review. Go ahead, it's your meeting.",
     jump:"🦴", label:"You talk first", sub:"OPEN · You talk first",

     lines:[["Thanks for making the time. Let's get the renewal right today, and I'd like your read first.",1]],
     why:"This gives him the first word. You say \"right\", not \"fast\". No number exists yet.",
     forks:[["still yours","Sure. Three things from the six months, then the contract.",""," Then beat 2.",1]]},
    {he:"Solid six months, EO's happy. Walk me through it. What went well, what did it actually get the business?",
     jump:"🦴", label:"Three outcomes", sub:"OPEN · Walk me through the results",
     gist:"One outcome per line. Under ninety seconds. Then stop.",
     lines:[["The pre-membership funnel runs in HubSpot and approved members land in Altai. The sixty-chapter rollout stands on that.",0],
            ["It was your brilliant idea to get every chapter's rollout status in one place, so nobody has to ask where a chapter stands in the process.",0],
            ["The full member base flows into HubSpot, so marketing runs on the whole base and the record stays one record.",0]],
     why:"Say outcomes, not names. Do not invoice the SOW. Do not mention the self-assessment."},
    {he:"Now the other side. What would you do differently? The estimate was a big number, and Khoa had to flag the CI thing.",
     jump:"🦴", label:"Differently", sub:"OPEN · one breath, then stop",

     lines:[["Two flags, two same-day fixes. The lesson was check-ins along the way, and I took it.",0]],
     why:"This owns both flags and defends neither. Say nothing after \"took it\". Never say \"more proactive\" or \"learn and grow\".",
     forks:[["he digs into one","🧨 HEAT, that row, one breath. Then: So, back to the job."]]},
    {he:"Rollout came in lower, I'm adding a person, the bonus offers go out with the October pay. On the base, HR and I approved a forty percent bump. That's the package.",
     jump:"🎯", label:"Mirror the money", sub:"HIS NUMBER · mirror, never the percent",
     gist:"Thirty-five?",
     lines:[["Thirty-five?",1]],
     why:"Five frames land in one breath. The mirror answers the only one that matters. He fills the silence. Pocket \"October pay\": the bonus question is now answered, so you never ask it.",
     conv:[["forty percent","35"],["fifty percent","37.5"],["fifty-two percent","38"],["sixty percent","40"],["eighty-seven percent","46.7"]]},
    {he:"Yeah. I've never signed a hundred percent for anyone. HR benchmarked the role. Third salary in the pool. That's approved, it's not a starting point.",

     gist:"If there were a way to get this to forty-six seven inside the structure, what would it look like?",
     lines:[["Okay.",1],["Thanks for getting it to a number. I know that took some doing.",1],["If there were a way to get this to forty-six seven inside the structure, what would it look like?",1]],
     why:"He walked you through it already, so skip that unit. The question puts the path on his side of the table, inside his rule."},
    {he:"There isn't one. Forty-six seven is basically double. Keep doing what you're doing, next renewal I'll be generous. Thirty-five.",
     jump:"🎯", label:"The rule, then Under 38", sub:"OPEN · the rule / HIS NUMBER · Under 38",
     gist:"A hundred would be fifty. I'm at forty-six seven, so I'm under it.",
     lines:[["A hundred would be fifty. I'm at forty-six seven, so I'm under it.",1],["And I just don't see thirty-five for a job this size. Help me out here, how do I make that work?",1]],
     why:"\"Double\" is a frame. Answer it in the exchange it lands. Then the engine: he has to solve it. \"Next renewal\" is date talk under 38. Keep it in your pocket.",
     forks:[["snaps","Fair. Sounds like thirty-five is where the budget sits today.",""," Then 🧊 Concession.",1],["gets to 38","Beat 7.","w"],["doesn't","⏱ EXIT. Never bridge under 38.","x"]]},
    {he:"I can go to thirty-eight. Over fifty percent, the most anyone's gotten from me. That's the ceiling. We're done.",

     lines:[["Thirty-eight?",1],["Okay, so we're both inside your rule now, just at different ends of it.",1],["Call the first step forty, and the step to forty-six seven in April is a small one.",1]],
     why:"The one move came, as read. His wall becomes a shared fence. Ask for forty once, never twice.",
     forks:[["goes to 40","🌉 Offer, with \"small\".","w"],["holds 38","🌉 Offer, no \"small\". Beat 8.",""]]},
    {he:"Forty? No. And what's this step in April? I don't do mid-contract raises. The renewal is the review.",

     lines:[["Then let's do it in two. Thirty-eight now, in the contract, and forty-six seven at the review, against the SOW.",1],["You set that bar. Let me go clear it, and you stay inside your rule both times.",1]],
     why:"His number does not move, so he has nothing to defend. The step is pinned to his SOW, not to a calendar or a mood."},
    {he:"I'm not writing a future number into a contract. If I do it for you, everyone wants one. You've got my word.",
     jump:"🌉", label:"Date, next renewal", sub:"BRIDGE · one try at April",

     forks:[["June or July","The date's off the SOW, not a calendar. Our side's built by April, so that's when your bar's cleared.",""," He holds: “Then the first step carries more of the weight. If it waits till July, where does thirty-eight go today?” Then the base from October must be 41 or more, and the step must land by July. Less, or later: One step.",1],["after EO renews","🧩 Market-gated first. Then back here.",""]]},

     why:"He grades nothing. HR schedules nothing. The SOW is the judge. The number did not move.",

     gist:"Which is easier to write? Thirty-eight now with the step, or forty-six seven now and we're done for the year.",

     why:"Two steps was your concession. He took it off the table, so the concession goes with it. Both branches are yours. The choice is his. Go slow on the second line.",

    {he:"Neither. Thirty-eight, no step. And the tenth is two weeks out, HR needs the paper signed this week.",
     jump:"🌉", label:"The email path", sub:"BRIDGE · HR paper can't carry a future number",

     lines:[["Then the paper carries the date and the bar, and your email carries the number. Both, and I'm good.",1]],
     why:"His objection is the paper, so give him a way out of the paper. His email counts. It costs him no precedent. The clock gets no answer here."},
    {he:"An email's the same thing in a different font. I'm not putting forty-six seven in writing anywhere. My word's been good for a year.",
     jump:"🌉", label:"Land it, once", sub:"BRIDGE · the last soft push",
     gist:"Your number stands. The step just gets it the rest of the way.",
     lines:[["Your number stands. The step just gets it the rest of the way.",1]],
     why:"This repeats the one thing he needs to hear: thirty-eight is not under attack. A graceful yes is on the table."},
    {he:"No. Thirty-eight, and that's my final answer on it.",
     jump:"🧊", label:"Walk", sub:"COLD · the last card, the paper, never the job",
     gist:"I wish I could say yes to that. I can't sign that one.",
     lines:[["I wish I could say yes to that. I can't sign that one.",1]],
     why:"Say nothing about leaving. Then the longest four-count of the meeting. He goes one of two ways.",

const CLOSE = {

const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const TRACK_NAME = {likely:"The likely room", first:"You first", mid:"40 to 46.6"};
function sayHTML(t,pause){ return `<p class="say">“${esc(t)}”${pause?`<span class="pause">(…)</span>`:""}</p>`; }
function forkHTML(f){
  const said = f[4]===1;
  const body = said ? `<span class="say">“${esc(f[1])}”</span>${f[3]?esc(f[3]):""}` : `${esc(f[1])}${f[3]?esc(f[3]):""}`;
  return `<li class="${f[2]||""}"><span class="if">${esc(f[0])}</span><span>${body}</span></li>`;
}

function renderNav(tr){
  const items = tr.id==="close"
    ? tr.sections.map(s=>`<li><a href="#${s[0]}" data-nav="${s[0]}"><span class="ni"></span><span class="nj">${s[1]}</span><span>${esc(s[2])}</span></a></li>`).join("")
    : tr.beats.map((b,i)=>`<li><a href="#${tr.id}-${i+1}" data-nav="${tr.id}-${i+1}" class="${b.cls||""}"><span class="ni">${i+1}</span><span class="nj">${b.jump}</span><span>${esc(b.label)}</span></a></li>`).join("");
  const toggle = tr.id==="close" ? "" : `<button class="toggle" id="toggle-all" aria-pressed="false">Open all scripts</button>`;
  return `<p class="k2">${tr.id==="close"?"Sections":"Beats, in order of play"}</p><ol class="navlist">${items}</ol>${toggle}`;
}

function renderTrack(tr){
  const beats = tr.beats.map((b,i)=>{
    const id = `${tr.id}-${i+1}`;
    const forks = b.forks? `<p class="k2">Branches</p><ul class="forks">${b.forks.map(forkHTML).join("")}</ul>`:"";
    const conv = b.conv? `<p class="k2">He says a percent. You mirror the money.</p><table class="conv"><tr><th>He says</th><th>It is</th></tr>${b.conv.map(r=>`<tr><td>${esc(r[0])}</td><td class="num">${esc(r[1])}</td></tr>`).join("")}</table>`:"";
    const go = b.go? `<p class="k2">Continue</p><div class="gos">${b.go.map(g=>`<button class="go" data-track="${g[1]}" data-beat="${g[2]}">${esc(g[0])} → ${esc(g[1]===tr.id?"beat "+g[2]:TRACK_NAME[g[1]]+", beat "+g[2])}</button>`).join("")}</div>`:"";
    const card = b.card? `<div class="card"><p class="t">${esc(b.card[0])}</p><p>${esc(b.card[1])}</p></div>`:"";
    return `<section class="beat ${b.cls||""}" id="${id}">
      <div class="n">${i+1}</div>
      <div class="col">
        <div class="he"><span class="who">He</span>${esc(b.he)}</div>
        <div class="you" data-open="false">
          <button class="head" aria-expanded="false" aria-controls="${id}-body">
            <span class="jump">${b.jump}</span>
            <span class="label">${esc(b.label)}<small>${esc(b.sub)}</small></span>
            <span class="cta">Script ▾</span>
          </button>
          <p class="gist">“${esc(b.gist)}”</p>
          <div class="body" id="${id}-body" hidden>
            <div>${b.lines.map(l=>sayHTML(l[0],l[1])).join("")}</div>
            <p class="why"><b>Why.</b> ${esc(b.why)}</p>
            ${conv}${forks}${go}${card}
          </div>
        </div>
      </div>
    </section>`;
  }).join("");
  return `<div class="intro"><p class="kicker">${esc(tr.tab)} · about ${esc(tr.odds)}</p><h2>${esc(tr.title)}</h2><p>${esc(tr.intro)}</p></div>
  <div class="beats">${beats}</div>
  <p class="foot">The list on the side is the spine, in order of play. Tap a beat there to open it here.</p>`;
}

      <p class="why"><b>Add</b> “And the bonus, [Y], landing with the October pay.” only when he named a figure or a date. His reply to the card decides the paper. Anything but a no: you sign. A no: you hold.</p>

const TABS = [...TRACKS, CLOSE];
let spyTargets = [];
function select(id){
  const tr = TABS.find(t=>t.id===id) || TRACKS[0];
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", b.dataset.id===tr.id ? "true":"false"));
  $("#content").innerHTML = tr.id==="close" ? renderClose() : renderTrack(tr);
  $("#side").innerHTML = renderNav(tr);
  try{ localStorage.setItem("rr-tab", tr.id); }catch(e){}
  try{ history.replaceState(null,"","#"+tr.id); }catch(e){}
  window.scrollTo({top:0});
  spyTargets = [...document.querySelectorAll("#content .beat, #content .section[id]")];
  spy();
  return tr.id;
}
function setOpen(you,open){
  you.dataset.open = open ? "true":"false";
  const head = $(".head",you); head.setAttribute("aria-expanded", open?"true":"false");
  $(".cta",you).textContent = open ? "Hide ▴" : "Script ▾";
  const body = document.getElementById(head.getAttribute("aria-controls"));
  if(body) body.hidden = !open;
}
function scrollTo(el, block){
  const rm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  el.scrollIntoView({block, behavior: rm?"auto":"smooth"});
}
function openBeat(track, n){
  const cur = document.querySelector(".tab[aria-selected='true']");
  if(!cur || cur.dataset.id!==track) select(track);
  const sec = document.getElementById(`${track}-${n}`);
  if(!sec) return;
  setOpen($(".you",sec), true);
  scrollTo(sec, "center");
}
function closeDrawer(){
  const side=$("#side"), btn=$("#navbtn");
  side.classList.remove("open"); btn.setAttribute("aria-expanded","false");
}
function spy(){
  const line = window.innerHeight*0.35;
  let best=null;
  for(const el of spyTargets){ if(el.getBoundingClientRect().top <= line) best=el; else break; }
  if(!best && spyTargets.length) best = spyTargets[0];
  document.querySelectorAll(".navlist a").forEach(a=>a.classList.toggle("active", !!best && a.dataset.nav===best.id));
}
window.addEventListener("scroll", ()=>requestAnimationFrame(spy), {passive:true});
function measureBar(){ document.documentElement.style.setProperty("--barh", $("#bar").offsetHeight+"px"); }
window.addEventListener("resize", measureBar);

document.addEventListener("click",e=>{
  const nav = e.target.closest("[data-nav]");
  if(nav){
    e.preventDefault();
    const id = nav.dataset.nav;
    if(id.startsWith("close-")){ const el=document.getElementById(id); if(el) scrollTo(el,"start"); }
    else { const i=id.lastIndexOf("-"); openBeat(id.slice(0,i), Number(id.slice(i+1))); }
    closeDrawer(); return;
  }
  const nb = e.target.closest("#navbtn");
  if(nb){ const open = nb.getAttribute("aria-expanded")!=="true"; $("#side").classList.toggle("open",open); nb.setAttribute("aria-expanded",open?"true":"false"); return; }
  if($("#side").classList.contains("open") && !e.target.closest("#side")) closeDrawer();
  const go = e.target.closest(".go");
  if(go){ openBeat(go.dataset.track, Number(go.dataset.beat)); return; }
  const tg = e.target.closest("#toggle-all");
  if(tg){
    const open = tg.getAttribute("aria-pressed")!=="true";
    tg.setAttribute("aria-pressed", open?"true":"false"); tg.textContent = open?"Close all scripts":"Open all scripts";
    document.querySelectorAll(".you").forEach(y=>setOpen(y,open));
    return;
  }
  const tab = e.target.closest(".tab");
  if(tab){ select(tab.dataset.id); return; }
  const you = e.target.closest(".you");
  if(you){
    if(e.target.closest(".body") && !e.target.closest(".head")) return;
    setOpen(you, you.dataset.open!=="true");
  }
});

(function boot(){
  $("#tabs").innerHTML = TABS.map(t=>`<button class="tab" role="tab" data-id="${t.id}" aria-selected="false">${esc(t.tab)}${t.odds?`<span class="odds">${esc(t.odds)}</span>`:""}</button>`).join("");
  measureBar();
  let start = (location.hash||"").replace("#","");
  if(!TABS.some(t=>t.id===start)){ try{ start = localStorage.getItem("rr-tab") || ""; }catch(e){ start=""; } }
  select(start || "likely");
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(measureBar);
})();
</script>
